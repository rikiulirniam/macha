<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#102A2A">
    <title>Sedang Offline — Macha</title>
    <link rel="icon" type="image/png" href="/icons/icon-192x192.png">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Plus Jakarta Sans", "Segoe UI", Roboto, sans-serif;
            background-color: #F7F5EF;
            color: #102A2A;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            -webkit-font-smoothing: antialiased;
        }
        .card {
            background-color: #F7F5EF;
            border: 2px solid #ECE8DC;
            border-radius: 28px;
            padding: 36px 24px;
            max-width: 420px;
            width: 100%;
            display: flex;
            flex-col;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        .logo-wrap {
            width: 80px;
            height: 80px;
            border-radius: 24px;
            background-color: #ECE8DC;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            border: 2px solid #102A2A;
            border-bottom: 4px solid #102A2A;
        }
        .logo-wrap img {
            width: 52px;
            height: 52px;
            object-fit: contain;
        }
        h1 {
            font-size: 20px;
            font-weight: 800;
            line-height: 1.2;
            color: #102A2A;
        }
        p {
            font-size: 13px;
            font-weight: 500;
            line-height: 1.5;
            color: rgba(16, 42, 42, 0.7);
        }
        .btn-reload {
            margin-top: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: #19A974;
            color: #F7F5EF;
            font-weight: 800;
            font-size: 14px;
            padding: 14px 28px;
            border-radius: 18px;
            border: 2px solid #118A5D;
            border-bottom: 4px solid #118A5D;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.1s ease, filter 0.1s ease;
            width: 100%;
        }
        .btn-reload:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }
        .badge {
            display: inline-block;
            background-color: #F2C14E;
            color: #102A2A;
            font-size: 11px;
            font-weight: 800;
            padding: 4px 12px;
            border-radius: 9999px;
            border: 1px solid #D4A238;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo-wrap">
            <img src="/icons/icon-192x192.png" alt="Macha Logo">
        </div>
        <span class="badge">Mode Offline</span>
        <h1>Koneksi Terputus</h1>
        <p>
            Kamu sedang tidak terhubung ke internet. Sambungkan kembali koneksi perangkatmu untuk menikmati bacaan terbaru, berdiskusi, dan mengumpulkan EXP harian!
        </p>
        <button type="button" class="btn-reload" onclick="window.location.reload()">
            Coba Muat Ulang
        </button>
    </div>
</body>
</html>
